name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend - Spring Boot CI
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Build & Tests
      - name: Build & Test Backend
        run: |
          cd backendapp
          mvn clean verify

      # 4️⃣ Package
      - name: Package JAR
        run: |
          cd backendapp
          mvn package -DskipTests

      # 5️⃣ Docker Build
      - name: Build Docker Image
        run: |
          cd backendapp
          docker build -t backendapp:latest .

  frontend:
    name: Frontend - Angular CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Test Frontend
        run: |
          cd frontend
          npm ci
          npm test -- --watch=false

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
