name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'

      # 3️⃣ Backend Tests + Coverage
      - name: Backend Tests
        run: |
          cd backend
          mvn clean test

      # 4️⃣ SonarCloud Backend
      - name: SonarCloud Backend Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          mvn sonar:sonar \
            -Dsonar.projectKey=backendapp \
            -Dsonar.organization=my-org \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

      # 5️⃣ Frontend Quality
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend Tests & Coverage
        run: |
          cd frontend
          npm ci
          npm test -- --watch=false --code-coverage