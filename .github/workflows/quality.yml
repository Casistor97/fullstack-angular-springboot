name: Code Quality

# Déclenchement du workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du code
      - uses: actions/checkout@v3

      # 2️⃣ Backend - Java / Spring Boot
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Build Backend & Run Tests
        run: |
          cd backend
          ./mvnw clean verify

      - name: SonarQube Scan - Backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=mon-projet-backend \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

      # 3️⃣ Frontend - Angular / Node
      - name: Set up Node.js 224
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Install Frontend Dependencies & Run Tests
        run: |
          cd frontend
          npm ci
          npm test --watch=false --browsers=ChromeHeadless --code-coverage
